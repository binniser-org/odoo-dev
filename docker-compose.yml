services:
  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons
    networks:
      - odoo-network
    restart: unless-stopped

volumes:
  odoo-web-data:

networks:
  odoo-network:
    external: true
